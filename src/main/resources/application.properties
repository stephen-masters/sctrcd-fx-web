# The port the old tomcat7-maven-plugin configuration served on.
server.port=9090

# Static files under src/main/resources/static are served at /resources/**,
# the URLs the original web application used.
spring.mvc.static-path-pattern=/resources/**

# Read requests and write responses as UTF-8, as the CharacterEncodingFilter
# in the old web.xml did.
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
